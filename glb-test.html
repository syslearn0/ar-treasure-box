<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLB 再生検証</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2d33;
        font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
      canvas { display: block; }
      #panel { position: fixed; top: 10px; left: 10px; z-index: 10;
        background: rgba(0,0,0,.72); color: #e6e6e6; padding: 10px 12px;
        border-radius: 8px; font: 12px/1.5 ui-monospace, Menlo, monospace; max-width: 46vw; }
      #log { white-space: pre-wrap; margin: 0 0 8px; }
      #ctrl { display: flex; gap: 8px; align-items: center; }
      button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #666;
        background: #333; color: #eee; cursor: pointer; }
      input[type=range] { width: 220px; }
    </style>
  </head>
  <body>
    <div id="panel">
      <pre id="log"></pre>
      <div id="ctrl">
        <button id="btn-pause" type="button">一時停止</button>
        <input id="seek" type="range" min="0" max="7" step="0.01" value="0" />
        <span id="time">0.00s</span>
      </div>
    </div>
    <script type="module" src="./src/glbtest.ts"></script>
  </body>
</html>
